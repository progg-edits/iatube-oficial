<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Tube 📺</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    :root { 
      --bg: #121217; --card: #1a1a24; --accent: #e044b0; 
      --gold: #f59e0b; --green: #22c55e; --purple: #a855f7; 
      --red: #ef4444; --tiktok-blue: #3897f0; --dono-purple: #c084fc;
    }
    body { background: var(--bg); color: #fff; min-height: 100vh; padding-bottom: 40px; }

    header { 
      background: var(--card); padding: 12px 20px; display: flex; align-items: center; 
      justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid #333; 
      position: sticky; top: 0; z-index: 100; 
    }
    .logo { font-size: 22px; font-weight: bold; color: var(--accent); cursor: pointer; }
    .coins-display { 
      background: rgba(245,158,11,0.15); border: 1px solid var(--gold); padding: 6px 14px; 
      border-radius: 20px; font-size: 15px; color: var(--gold); font-weight: bold; display: flex; align-items: center; gap: 6px;
    }
    .user-bar { display: flex; align-items: center; gap: 12px; }
    .btn { 
      padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; 
      font-weight: bold; font-size: 14px; transition: 0.2s;
    }
    .btn:hover { transform: scale(1.03); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: var(--green); color: white; }
    .btn-secondary { background: #3a3a4a; color: white; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    main { padding: 20px; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 20px; margin: 30px 0 15px; }

    .lives { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
    .live-card { 
      min-width: 270px; background: var(--card); border-radius: 12px; overflow: hidden; 
      cursor: pointer; border: 1px solid #333; transition: 0.2s;
    }
    .live-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .live-thumb { 
      height: 150px; background: linear-gradient(135deg, #2a1a3a, #1a2a3a); 
      display: flex; align-items: center; justify-content: center; font-size: 50px; position: relative; 
    }
    .live-badge { 
      position: absolute; top: 8px; left: 8px; background: var(--red); color: white; 
      padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; 
    }
    .live-badge::before { 
      content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; 
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .live-info { padding: 12px; }
    .live-channel { font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
    .live-title { font-size: 13px; color: #aaa; margin-bottom: 6px; }
    .live-viewers { font-size: 12px; color: var(--green); font-weight: bold; }

    .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
    .video-card { 
      background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer; 
      border: 1px solid #333; transition: 0.2s;
    }
    .video-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .video-thumb { 
      height: 150px; background: #2a2a3a; display: flex; align-items: center; justify-content: center; font-size: 50px; position: relative; 
    }
    .video-duration { 
      position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 12px; 
    }
    .video-info { padding: 12px; }
    .video-title { font-weight: bold; margin-bottom: 6px; font-size: 15px; }
    .video-channel { font-size: 13px; color: #888; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    .video-stats { display: flex; gap: 12px; font-size: 12px; color: #777; }
    .stat-item { display: flex; align-items: center; gap: 3px; }
    .earn-note { font-size: 11px; color: var(--gold); margin-top: 6px; }

    .modal { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; 
      z-index: 1000; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; border: 1px solid #444; }
    .modal-title { font-size: 18px; margin-bottom: 15px; }
    .modal-close { float: right; font-size: 22px; cursor: pointer; color: #888; margin-top: -5px; }
    .modal-input { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #2a2a3a; color: white; margin-bottom: 12px; font-size: 14px; }
    label { font-size: 13px; color: #aaa; display: block; margin-bottom: 5px; }
    .hidden { display: none !important; }

    .toast { 
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
      background: var(--card); border: 1px solid var(--gold); color: var(--gold); padding: 12px 24px; 
      border-radius: 8px; z-index: 9999; opacity: 0; transition: 0.3s; font-weight: bold;
    }
    .toast.show { opacity: 1; }

    .verified { color: var(--tiktok-blue); font-weight: bold; font-size: 12px; }
    .verified::after { content: " ✓"; }

    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); cursor: pointer; margin-bottom: 20px; }
    .page { display: none; }
    .page.active { display: block; }

    .video-player-page { background: #000; border-radius: 12px; padding: 40px; text-align: center; margin-bottom: 20px; }
    .like-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; }
    .like-btn.liked { color: var(--accent); }
  </style>
</head>
<body>

<!-- Toast de notificação -->
<div id="toast" class="toast"></div>

<!-- Modal Login -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal('loginModal')">✕</span>
    <h3 class="modal-title">🎬 Entrar</h3>
    <label>Seu nome</label>
    <input type="text" id="inpNome" class="modal-input" placeholder="Digite seu nome...">
    <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer;">
      <input type="checkbox" id="chkOwner" onchange="toggleOwnerPass()">
      <span>👑 Sou o Dono</span>
    </label>
    <div id="ownerPassWrap" class="hidden">
      <label>Senha do Dono</label>
      <input type="password" id="ownerPass" class="modal-input" placeholder="Digite a senha...">
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Entrar ✅</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="logo" onclick="goHome()">📺 IA Tube</div>
  <div class="coins-display" id="coinsDisplay">💰 0</div>
  <div class="user-bar" id="userBar">
    <button class="btn btn-primary" onclick="openModal('loginModal')">Entrar</button>
  </div>
</header>

<main>
  <!-- Página Inicial -->
  <div id="pageHome" class="page active">
    <h2>🔴 Lives agora</h2>
    <div class="lives" id="livesContainer"></div>

    <h2>🎬 Vídeos</h2>
    <div class="videos" id="videosContainer"></div>
  </div>

  <!-- Página de Vídeo -->
  <div id="pageVideo" class="page">
    <div class="back" onclick="goHome()">← Voltar</div>
    <div class="video-player-page">
      <div style="font-size:60px; margin-bottom:20px;">🎬</div>
      <h2 id="videoPageTitle"></h2>
      <p id="videoPageChannel" style="color:#888; margin:8px 0;"></p>
      <p id="videoPageViews" style="color:#666; font-size:14px;"></p>
      <div style="margin-top:15px; display:flex; justify-content:center; gap:20px;">
        <button id="likeBtn" class="like-btn" onclick="likeVideo()">❤️ <span id="likeCount">0</span></button>
      </div>
      <p class="earn-note" style="margin-top:15px;">💰 Você ganha moedas assistindo e curtindo!</p>
    </div>
  </div>

  <!-- Página de Live -->
  <div id="pageLive" class="page">
    <div class="back" onclick="goHome()">← Voltar</div>
    <div class="video-player-page">
      <div style="font-size:60px; margin-bottom:20px;">🔴</div>
      <h2 id="livePageTitle"></h2>
      <p id="livePageChannel" style="color:#888; margin:8px 0;"></p>
      <p id="livePageViewers" style="color:var(--green); font-weight:bold;"></p>
      <p class="earn-note" style="margin-top:15px;">💰 Você ganha moedas a cada minuto assistindo à live!</p>
    </div>
  </div>
</main>

<script>
// ================= DADOS =================
let usuario = { nome: '', dono: false, moedas: 0 };
let videos = [];
let lives = [];
let intervalos = [];

// Lista de bots
const bots = [
  { nome: 'GamerLima', emoji: '🎮', verificado: true },
  { nome: 'SarahArts', emoji: '🎨', verificado: false },
  { nome: 'TechPedro', emoji: '💻', verificado: true },
  { nome: 'AnaMusic', emoji: '🎵', verificado: false },
  { nome: 'LuanFitness', emoji: '💪', verificado: false },
  { nome: 'JulinhaGames', emoji: '🕹️', verificado: true },
  { nome: 'CarlosCozinha', emoji: '🍳', verificado: false },
  { nome: 'BeatrizVlogs', emoji: '📸', verificado: true },
  { nome: 'RafaelMotos', emoji: '🏍️', verificado: false },
  { nome: 'MarianaModa', emoji: '👗', verificado: false },
];

const titulosVideos = [
  'Como subir de rank rápido! 💡',
  'Melhores momentos da semana 🎯',
  'Tutorial completo para iniciantes 📖',
  'Testando coisas novas no jogo 🧪',
  'Reagindo a vídeos incríveis 😮',
  'Dicas que ninguém te conta! 🤫',
  'Minha rotina de estudos 📚',
  'Desafio impossível! 🔥',
  'Explorando lugares novos 🌍',
  'Top 5 truques que você precisa saber ✅',
];

const titulosLives = [
  'Jogando junto com vocês! Venham! 🎮',
  'Rankeada subindo pra topo! 🏆',
  'Conversa ao vivo + joguinho 😊',
  'Tutorial passo a passo ao vivo 📖',
  'Bora bater papo? 💬',
  'Desafio: conseguir finalizar hoje? 🔥',
  'Primeira live do canal! Obrigado! ❤️',
  'Respondendo perguntas ao vivo 🙋',
];

// ================= INICIALIZAR =================
function init() {
  gerarConteudoBots();
  renderizarTudo();
  iniciarBotsAoVivo();
  atualizarMoedasDisplay();
}

// Gerar vídeos e lives dos bots
function gerarConteudoBots() {
  videos = [];
  lives = [];
  
  // Cada bot tem 1 vídeo
  bots.forEach((bot, i) => {
    videos.push({
      id: `vid-${i}`,
      titulo: titulosVideos[i % titulosVideos.length],
      canal: bot.nome,
      emoji: bot.emoji,
      verificado: bot.verificado,
      visualizacoes: Math.floor(Math.random() * 15000) + 100,
      curtidas: Math.floor(Math.random() * 2000) + 50,
      duracao: `${Math.floor(Math.random() * 15) + 1}:${String(Math.floor(Math.random() * 60)).padStart(2,'0')}`,
    });
  });

  // Metade dos bots está em live
  const numLives = Math.floor(bots.length / 2);
  for (let i = 0; i < numLives; i++) {
    const bot = bots[i];
    lives.push({
      id: `live-${i}`,
      titulo: titulosLives[i % titulosLives.length],
      canal: bot.nome,
      emoji: bot.emoji,
      verificado: bot.verificado,
      espectadores: Math.floor(Math.random() * 500) + 20,
    });
  }
}

// Renderizar tudo
function renderizarTudo() {
  renderizarLives();
  renderizarVideos();
}

function renderizarLives() {
  const container = document.getElementById('livesContainer');
  container.innerHTML = '';
  
  if (lives.length === 0) {
    container.innerHTML = '<p style="color:#666;">Nenhuma live no momento. Volte mais tarde!</p>';
    return;
  }

  lives.forEach(live => {
    const card = document.createElement('div');
    card.className = 'live-card';
    card.onclick = () => abrirLive(live);
    card.innerHTML = `
      <div class="live-thumb">
        <div class="live-badge">AO VIVO</div>
        ${live.emoji}
      </div>
      <div class="live-info">
        <div class="live-channel">
          ${live.canal}
          ${live.verificado ? '<span class="verified"></span>' : ''}
        </div>
        <div class="live-title">${live.titulo}</div>
        <div class="live-viewers">👁 ${live.espectadores} assistindo</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function renderizarVideos() {
  const container = document.getElementById('videosContainer');
  container.innerHTML = '';

  videos.forEach(video => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.onclick = () => abrirVideo(video);
    card.innerHTML = `
      <div class="video-thumb">
        ${video.emoji}
        <span class="video-duration">${video.duracao}</span>
      </div>
      <div class="video-info">
        <div class="video-title">${video.titulo}</div>
        <div class="video-channel">
          ${video.canal}
          ${video.verificado ? '<span class="verified"></span>' : ''}
        </div>
        <div class="video-stats">
          <span class="stat-item">👁 ${formatarNumero(video.visualizacoes)}</span>
          <span class="stat-item">❤️ ${formatarNumero(video.curtidas)}</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// ================= FUNÇÕES DE PÁGINA =================
let videoAtual = null;
let liveAtual = null;
let tempoAssistindo = 0;
let intervaloLive = null;

function abrirVideo(video) {
  if (!usuario.nome) {
    mostrarToast('⚠️ Faça login primeiro para ganhar moedas!');
    openModal('loginModal');
    return;
  }
  
  videoAtual = video;
  liveAtual = null;
  esconderPaginas();
  document.getElementById('pageVideo').classList.add('active');
  
  document.getElementById('videoPageTitle').textContent = video.titulo;
  document.getElementById('videoPageChannel').textContent = `${video.emoji} ${video.canal}`;
  document.getElementById('videoPageViews').textContent = `${formatarNumero(video.visualizacoes)} visualizações`;
  document.getElementById('likeCount').textContent = formatarNumero(video.curtidas);
  document.getElementById('likeBtn').classList.remove('liked');
  
  // Ganha moedas por assistir
  ganharMoedas(2);
  mostrarToast('+💰 2 moedas por assistir!');
}

function abrirLive(live) {
  if (!usuario.nome) {
    mostrarToast('⚠️ Faça login primeiro para ganhar moedas!');
    openModal('loginModal');
    return;
  }
  
  liveAtual = live;
  videoAtual = null;
  esconderPaginas();
  document.getElementById('pageLive').classList.add('active');
  
  document.getElementById('livePageTitle').textContent = live.titulo;
  document.getElementById('livePageChannel').textContent = `${live.emoji} ${live.canal}`;
  document.getElementById('livePageViewers').textContent = `👁 ${live.espectadores} pessoas assistindo`;
  
  // Ganha moedas a cada minuto na live
  tempoAssistindo = 0;
  if (intervaloLive) clearInterval(intervaloLive);
  intervaloLive = setInterval(() => {
    tempoAssistindo++;
    if (tempoAssistindo % 60 === 0) {
      ganharMoedas(5);
      mostrarToast('+💰 5 moedas — obrigado por assistir!');
    }
    // Atualiza espectadores de tempos em tempos
    if (Math.random() < 0.15) {
      live.espectadores += Math.floor(Math.random() * 10) - 4;
      if (live.espectadores < 5) live.espectadores = 10;
      document.getElementById('livePageViewers').textContent = `👁 ${live.espectadores} pessoas assistindo`;
    }
  }, 1000);
}

function likeVideo() {
  if (!videoAtual) return;
  
  const btn = document.getElementById('likeBtn');
  if (btn.classList.contains('liked')) {
    mostrarToast('⚠️ Você já curtiu este vídeo!');
    return;
  }
  
  btn.classList.add('liked');
  videoAtual.curtidas++;
  document.getElementById('likeCount').textContent = formatarNumero(videoAtual.curtidas);
  ganharMoedas(3);
  mostrarToast('+💰 3 moedas por curtir! Obrigado! ❤️');
}

function goHome() {
  if (intervaloLive) clearInterval(intervaloLive);
  esconderPaginas();
  document.getElementById('pageHome').classList.add('active');
  renderizarTudo();
}

function esconderPaginas() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
}

// ================= SISTEMA DE MOEDAS =================
function ganharMoedas(quantia) {
  usuario.moedas += quantia;
  atualizarMoedasDisplay();
  salvarDados();
}

function atualizarMoedasDisplay() {
  document.getElementById('coinsDisplay').textContent = `💰 ${usuario.moedas}`;
}

// ================= BOTS DINÂMICOS =================
function iniciarBotsAoVivo() {
  // A cada tempo, muda quem está em live e atualiza espectadores
  setInterval(() => {
    lives.forEach(live => {
      const mudanca = Math.floor(Math.random() * 7) - 3;
      live.espectadores = Math.max(5, live.espectadores + mudanca);
    });
    renderizarLives();
  }, 8000);

  // A cada 40s, um bot novo posta vídeo
  setInterval(() => {
    const bot = bots[Math.floor(Math.random() * bots.length)];
    const novoVid = {
      id: `vid-${Date.now()}`,
      titulo: titulosVideos[Math.floor(Math.random() * titulosVideos.length)],
      canal: bot.nome,
      emoji: bot.emoji,
      verificado: bot.verificado,
      visualizacoes: 0,
      curtidas: 0,
      duracao: `${Math.floor(Math.random() * 15) + 1}:${String(Math.floor(Math.random() * 60)).padStart(2,'0')}`,
    };
    videos.unshift(novoVid);
    if (videos.length > 15) videos.pop();
    renderizarVideos();
  }, 40000);
}

// ================= LOGIN =================
function toggleOwnerPass() {
  const wrap = document.getElementById('ownerPassWrap');
  wrap.classList.toggle('hidden');
}

function doLogin() {
  const nome = document.getElementById('inpNome').value.trim();
  if (!nome) {
    mostrarToast('⚠️ Digite seu nome!');
    return;
  }

  const ehDono = document.getElementById('chkOwner').checked;
  const senha = document.getElementById('ownerPass').value;
  
  if (ehDono && senha !== 'progg_edits20_15_67') {
    mostrarToast('❌ Senha incorreta!');
    return;
  }

  usuario.nome = nome;
  usuario.dono = ehDono;
  
  // Carrega moedas salvas ou começa com 0
  const salvas = localStorage.getItem('iatube-moedas');
  usuario.moedas = salvas ? parseInt(salvas) : 0;
  
  atualizarMoedasDisplay();
  closeModal('loginModal');
  
  document.getElementById('userBar').innerHTML = `
    <span style="font-size:14px;">👤 ${nome} ${ehDono ? '👑' : ''}</span>
    <button class="btn btn-sm btn-secondary" onclick="sair()">Sair</button>
  `;
  
  mostrarToast(`✅ Bem-vindo, ${nome}!`);
}

function sair() {
  salvarDados();
  usuario = { nome: '', dono: false, moedas: 0 };
  atualizarMoedasDisplay();
  document.getElementById('userBar').innerHTML = '<button class="btn btn-primary" onclick="openModal(\'loginModal\')">Entrar</button>';
  goHome();
  mostrarToast('👋 Até logo!');
}

function salvarDados() {
  localStorage.setItem('iatube-moedas', usuario.moedas);
}

// ================= UTILITÁRIAS =================
function formatarNumero(n) {
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/, '') + 'mil';
  return n.toString();
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Iniciar tudo quando carregar
window.onload = init;
</script>
</body>
</html>
